<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lyu Zhuojun - AI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="46%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.82 0 0 0 0 0.93 0 0 0 .75 0" result="cyanGlow"/>
      <feMerge><feMergeNode in="cyanGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#334155" stroke-width="1" opacity="0.32"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#grid)" opacity="0.55"/>
  <circle cx="180" cy="74" r="170" fill="#0ea5e9" opacity="0.18"/>
  <circle cx="960" cy="70" r="210" fill="#ec4899" opacity="0.16"/>
  <circle cx="900" cy="310" r="190" fill="#8b5cf6" opacity="0.14"/>
  <path d="M70 260 C240 170, 360 330, 540 220 S840 110, 1130 245" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.88" filter="url(#glow)"/>
  <rect x="74" y="54" width="220" height="38" rx="19" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
  <circle cx="98" cy="73" r="6" fill="#22c55e" filter="url(#glow)"/>
  <text x="116" y="79" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">github.com/lvzhuojun</text>
  <text x="74" y="162" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Lyu Zhuojun</text>
  <text x="78" y="214" fill="url(#neon)" font-family="Consolas, Monaco, monospace" font-size="28" font-weight="700">AI Builder · ML Systems · Voice &amp; Agent Apps</text>
  <text x="78" y="262" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Recommendation · NLP · LLM Agents · Voice AI · Computer Vision</text>
  <g transform="translate(850,98)">
    <rect width="260" height="150" rx="22" fill="#020617" stroke="#475569" opacity="0.86"/>
    <circle cx="28" cy="28" r="6" fill="#ef4444"/><circle cx="50" cy="28" r="6" fill="#f59e0b"/><circle cx="72" cy="28" r="6" fill="#22c55e"/>
    <text x="28" y="72" fill="#22d3ee" font-family="Consolas, Monaco, monospace" font-size="18">&gt; whoami</text>
    <text x="28" y="104" fill="#e2e8f0" font-family="Consolas, Monaco, monospace" font-size="18">practical_ai_builder</text>
    <rect x="28" y="124" width="160" height="8" rx="4" fill="url(#neon)" opacity="0.85"/>
